    <div class="sotay-container">
        <div

        <div class="controls">

                { h: "应该", p: "yīng gāi", v: "Nên", r: "Ưng (应) có bộ Quảng (广); Cai (该) gồm bộ Ngôn (讠) + chữ Hợi (亥)." },
                { h: "敢", p: "gǎn", v: "Dám", r: "Bên trái là ký hiệu tay cầm vũ khí chống thú dữ + bên phải là bộ Phộc (攵)." },
                { h: "愿", p: "yuàn", v: "Mong, nguyện", r: "Chữ Nguyên (原) ở trên chỉ nguồn gốc + bộ Tâm (心) ở dưới chỉ tâm nguyện." },
                { h: "爱", p: "ài", v: "Yêu", r: "Ở giữa chữ cổ có bộ Tâm (心) thể hiện tình cảm xuất phát từ trái tim." },
                { h: "喜欢", p: "xǐ huan", v: "Thích", r: "Hỷ (喜) mang nghĩa vui vẻ, chúc mừng; Hoan (欢) có bộ Khiếm (欠) chỉ tiếng reo hò." },
                { h: "嫌", p: "xián", v: "Chê, hiềm khích", r: "Bộ Nữ (女) thể hiện cảm xúc, tâm lý phức tạp + chữ Kiêm (兼)." },
                { h: "批评", p: "pī píng", r: "Phê bình", r: "Phê (批) có bộ Thủ (扌); Bình (评) gồm bộ Ngôn (讠) + chữ Bình (平)." },
                { h: "表扬", p: "biǎo yáng", v: "Biểu dương", r: "Biểu (表) nghĩa là phơi bày ra; Dương (扬) có bộ Thủ (扌) chỉ việc giơ cao lên." },
                { h: "飞", p: "fēi", v: "Bay", r: "Chữ tượng hình phác họa lại đôi cánh của một chú chim đang dang rộng để bay." },
                { h: "打扫", p: "dǎ sǎo", v: "Quét dọn", r: "Đả (打) hành động tay + Tảo (扫) gồm bộ Thủ (扌) và hình cái chổi quét nhà." },
                { h: "找", p: "zhǎo", v: "Tìm kiếm", r: "Bộ Thủ (扌) dùng tay tìm tòi + chữ Qua (戈) cây giáo (cầm vũ khí đi tìm)." },
                { h: "收", p: "shōu", v: "Thu, nhận", r: "Bên trái biểu thị sợi dây dệt vải + bên phải là bộ Phộc (攵) hành động gõ/thu gom." },
                { h: "等", p: "děng", v: "Chờ, đợi", r: "Bộ Trúc (竹) ở trên ngôi chùa (Tự 寺) - ngày xưa ghi chép thẻ tre đợi sắc phong." },
                { h: "参观", p: "cān guān", v: "Tham quan", r: "Tham (参) nghĩa là tham gia; Quan (观) gồm bộ Kiến (见) mang nghĩa nhìn xem." },
                { h: "来", p: "lái", v: "Đến", r: "Chữ tượng hình ban đầu mô phỏng bông lúa mì, sau mượn nghĩa gốc thành 'đến'." },
                { h: "到", p: "dào", v: "Đến", r: "Chữ Chí (至) nghĩa là đạt tới + bộ Đao (刂) chỉ kết quả phân định rõ ràng." },
                { h: "取", p: "qǔ", v: "Rút, lấy", r: "Bộ Nhĩ (耳) - tai + bộ Hựu (又) - bàn tay hành động (chặt tai kẻ địch thu chiến công)." }
            ];

            let words = masterData.slice(0, 25);

            function changeRange() {
                const val = document.getElementById('rangeSelect').value;
                if (val === '1-25') {
                    words = masterData.slice(0, 25);
                } else if (val === '26-50') {
                    words = masterData.slice(25, 50);
                } else if (val === '51-78') {
                    words = masterData.slice(50, 78);
                } else if (val === '79-100') {
                    words = masterData.slice(78, 100);
                } else if (val === '101-121') {
                    words = masterData.slice(100, 121);
                } else if (val === 'all') {
                    words = [...masterData];
                }
                currentIndex = 0;
                if (typeof updateUI === 'function') updateUI();
            }
        </script>
        <script src="js/sotay.js"></script>
