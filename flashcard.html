<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Flashcard Từ Vựng</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="sotay.html">Sổ Tay</a></li>
            <li><a href="flashcard.html" class="active">Flashcard</a></li>
        </ul>
    </nav>
    <div class="flashcard-container">
        <!-- RANGE SELECTOR UI -->
        <div style="margin-top:20px; margin-bottom: 10px; display:flex; gap:10px; align-items:center; flex-wrap: wrap; justify-content: center;">
            <label for="rangeSelect" style="font-weight:bold; color:var(--secondary);">Lựa chọn số từ ôn tập:</label>
            <select id="rangeSelect" style="padding:8px 12px; border-radius:10px; border:1px solid #ccc; font-weight:bold; color:var(--primary); cursor:pointer;" onchange="changeRange()">
                <option value="1-100" selected>Từ 1 - 100</option>
                <option value="101-200">Từ 101 - 200</option>
                <option value="201-300">Từ 201 - 300</option>
                <option value="all">Tất cả 300 từ</option>
                <option value="random-50">50 từ (Ngẫu nhiên)</option>
                <option value="random-100">100 từ (Ngẫu nhiên)</option>
                <option value="random-200">200 từ (Ngẫu nhiên)</option>
            </select>
        </div>

        <div class="card-container" id="cardContainer" onclick="handleFlip()">
            <div class="card-inner">
                <div class="front">
                    <div class="label">Nghĩa tiếng Việt</div>
                    <div class="meaning" id="frontMeaning">...</div>
                    <div class="hint">Chạm để lật thẻ</div>
                </div>
                <div class="back">
                    <div class="back-header">
                        <div class="static-hanzi" id="backHanziText"></div>
                        <div class="pinyin" id="backPinyin"></div>
                    </div>
                    <div id="stroke-wrapper"></div>
                    <button class="replay-btn" onclick="replayAll(event)">VIẾT LẠI NÉT ↺</button>
                    <div class="radical-info" id="backRadical"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <span id="counter">1 / 100</span>
            <button class="btn-next" id="nextBtn" onclick="nextCard(event)">TIẾP THEO ➔</button>
        </div>

        <script>
            const masterData = [
                { h: "你", p: "nǐ", v: "bạn", r: "Bộ Nhân (亻) - người + bộ Mịch (冖) + bộ Tiểu (小)." },
                { h: "你们", p: "nǐmen", v: "các bạn", r: "Chữ 们 có bộ Nhân (亻) chỉ người." },
                { h: "我", p: "wǒ", v: "tôi", r: "Bộ Qua (戈) - binh khí. Ý nghĩa: Cái tôi mạnh mẽ." },
                { h: "我们", p: "wǒmen", v: "chúng tôi", r: "我 (Tôi) + 们 (số nhiều)." },
                { h: "也", p: "yě", v: "cũng", r: "Nguyên thủy là hình con rắn." },
                { h: "他", p: "tā", v: "anh ấy", r: "Bộ Nhân (亻) - chỉ nam giới." },
                { h: "她", p: "tā", v: "cô ấy", r: "Bộ Nữ (女) - chỉ nữ giới." },
                { h: "它", p: "tā", v: "nó", r: "Bộ Miên (宀) - mái nhà. Dùng cho vật." },
                { h: "他们", p: "tāmen", v: "họ (nam)", r: "Sử dụng 'tha' nam làm đại diện chung." },
                { h: "她们", p: "tāmen", v: "họ (nữ)", r: "Sử dụng 'tha' nữ làm đại diện chung." },
                { h: "大家", p: "dàjiā", v: "mọi người", r: "Đại (大) - lớn + Gia (家) - nhà (bộ Miên 宀)." },
                { h: "朋友", p: "péngyou", v: "bạn bè", r: "Bằng (朋) - 2 vầng trăng + Hữu (友) - bộ Hựu." },
                { h: "爷爷", p: "yéye", v: "ông nội", r: "Bộ Phụ (父) - cha/ông." },
                { h: "奶奶", p: "nǎinai", v: "bà nội", r: "Bộ Nữ (女) - phụ nữ/bà." },
                { h: "外公", p: "wàigōng", v: "ông ngoại", r: "Ngoại (外) - bộ Tịch + Công (公) - bộ Bát." },
                { h: "外婆", p: "wàipó", v: "bà ngoại", r: "Ngoại (外) + Bà (婆) - có bộ Nữ (女)." },
                { h: "爸爸", p: "bàba", v: "bố", r: "Bộ Phụ (父) - cha, người đàn ông trụ cột." },
                { h: "妈妈", p: "māma", v: "mẹ", r: "Bộ Nữ (女) - phụ nữ + chữ Mã (马) tượng thanh." },
                { h: "父母", p: "fùmǔ", v: "cha mẹ", r: "Phụ (父) + Mẫu (母)." },
                { h: "孩子", p: "háizi", v: "con cái", r: "Bộ Tử (子) - đứa trẻ." },
                { h: "儿女", p: "érnǚ", v: "con cái", r: "Bộ nhi (儿) - bộ nữ(女)." },
                { h: "女儿", p: "nǚ'ér", v: "con gái", r: "Bộ Nữ (女) + bộ Nhi (儿)." },
                { h: "儿子", p: "érzi", v: "con trai", r: "Bộ Nhi (儿) + bộ Tử (子)." },
                { h: "哥哥", p: "gēge", v: "anh trai", r: "Gồm 2 bộ Khả (可) chồng lên nhau." },
                { h: "姐姐", p: "jiějie", v: "chị gái", r: "Bộ Nữ (女) + bộ Thả (且)." },
                { h: "妹妹", p: "mèimei", v: "em gái", r: "Bộ Nữ (女) + chữ Vị (未) - chưa trưởng thành." },
                { h: "弟弟", p: "dìdi", v: "em trai", r: "Bộ Cung (弓) + nét phẩy." },
                { h: "老师", p: "lǎoshī", v: "thầy cô", r: "Bộ Lão (耂) - già + bộ Cân (巾) - khăn." },
                { h: "学生", p: "xuésheng", v: "học sinh", r: "Bộ Tử (子) - con trẻ + bộ Sinh (生)." },
                { h: "同学", p: "tóngxué", v: "bạn học", r: "Đồng (同) - bộ Quynh + Học (学)." },
                { h: "工人", p: "gōngrén", v: "công nhân", r: "Công (工) - thợ + Nhân (人) - người." },
                { h: "老板", p: "lǎobǎn", v: "ông chủ", r: "Lão (老) + Bản (板) - có bộ Mộc (木)." },
                { h: "医生", p: "yīshēng", v: "bác sĩ", r: "Y (医) - bộ Phương 匚 + Sinh (生)." },
                { h: "爱人", p: "àirén", v: "người yêu, vợ", r: "Ái (爱) - yêu + Nhân (人) - người." },
                { h: "女友", p: "nǚyǒu", v: "bạn gái", r: "Nữ (女) + Hữu (友)." },
                { h: "男友", p: "nányǒu", v: "bạn trai", r: "Nam (男) + Hữu (友)." },
                { h: "年", p: "nián", v: "năm", r: "Can (干)." },
                { h: "今年", p: "jīnnián", v: "năm nay", r: "Kim (今) + Niên (年)." },
                { h: "去年", p: "qùnián", v: "năm ngoái", r: "Khứ (去) + Niên (年)." },
                { h: "每年", p: "měinián", v: "hàng năm", r: "Mỗi (每) + Niên (年)." },
                { h: "月", p: "yuè", v: "tháng", r: "Bộ Nguyệt (月)." },
                { h: "这个月", p: "zhège yuè", v: "tháng này", r: "Giá (这) - bộ Quai xước." },
                { h: "上个月", p: "shàng ge yuè", v: "tháng trước", r: "Thượng (上)." },
                { h: "下个月", p: "xià ge yuè", v: "tháng sau", r: "Hạ (下)." },
                { h: "每个月", p: "měige yuè", v: "hàng tháng", r: "Mỗi (每) - bộ Vô + Nguyệt (月)." },
                { h: "号", p: "hào", v: "số ngày", r: "Bộ Khẩu (口)." },
                { h: "日", p: "rì", v: "ngày", r: "Hình mặt trời." },
                { h: "天", p: "tiān", v: "ngày, trời", r: "Bộ Đại (大)." },
                { h: "今天", p: "jīntiān", v: "hôm nay", r: "Kim (今) + Thiên (天)." },
                { h: "明天", p: "míngtiān", v: "ngày mai", r: "Minh (明) + Thiên (天)." },
                { h: "昨天", p: "zuótiān", v: "hôm qua", r: "Tạc (昨) - bộ Nhật." },
                { h: "后天", p: "hòutiān", v: "ngày kia", r: "Hậu (post) - sau." },
                { h: "每天", p: "měitiān", v: "hàng ngày", r: "Mỗi (每) + Thiên (天)." },
                { h: "星期", p: "xīngqī", v: "thứ tuần", r: "Tinh (星) + Kỳ (期)." },
                { h: "周", p: "zhōu", v: "thứ tuần", r: "Bộ Quynh (冂)." },
                { h: "礼拜", p: "lǐbài", v: "thứ tuần", r: "Lễ (礼) + Bái (拜)." },
                { h: "周末", p: "zhōumò", v: "cuối tuần", r: "Chu (周) + Mạt (末) - ngọn/hết." },
                { h: "上午", p: "shàngwǔ", v: "buổi sáng", r: "Ngọ (午)." },
                { h: "早上", p: "zǎoshang", v: "buổi sáng", r: "Tảo (早) + Thượng (上)." },
                { h: "中午", p: "zhōngwǔ", v: "buổi trưa", r: "Trung (中) + Ngọ (午)." },
                { h: "下午", p: "xiàwǔ", v: "buổi chiều", r: "Hạ (下) + Ngọ (午)." },
                { h: "晚上", p: "wǎnshang", v: "buổi tối", r: "Vãn (晚) + Thượng (上)." },
                { h: "点", p: "diǎn", v: "giờ", r: "Bộ Hỏa (灬)." },
                { h: "分", p: "fēn", v: "phút", r: "Bộ Bát (八) + Đao (刀)." },
                { h: "分钟", p: "fēnzhōng", v: "phút", r: "Phân (分) + Chung (钟)." },
                { h: "秒", p: "miǎo", v: "giây", r: "Bộ Hòa (禾) + Thiểu (少)." },
                { h: "星期日", p: "xīngqīrì", v: "chủ nhật", r: "Tinh Kỳ + Nhật (日)." },
                { h: "星期天", p: "xīngqītiān", v: "chủ nhật", r: "Tinh Kỳ + Thiên (天)." },
                { h: "手机", p: "shǒujī", v: "điện thoại di động", r: "Thủ (手) - tay + Cơ (机)." },
                { h: "电话", p: "diànhuà", v: "điện thoại", r: "Điện (电) + Thoại (话) - bộ Ngôn." },
                { h: "谁", p: "shéi", v: "ai", r: "Bộ Ngôn (讠) - lời nói + bộ Truy (隹)." },
                { h: "什么", p: "shénme", v: "cái gì", r: "Thập (什) - bộ Nhân + Ma (么) - bộ Phiệt." },
                { h: "哪", p: "nǎ", v: "nào", r: "Bộ Ấp (阝) nằm bên phải." },
                { h: "哪儿", p: "nǎr", v: "đâu", r: "哪 + bộ Nhi (儿) dùng làm âm cuốn lưỡi." },
                { h: "为什么", p: "wèishénme", v: "vì sao", r: "Vi (为) + Thập Ma (import)." },
                { h: "家", p: "jiā", v: "nhà", r: "Bộ Miên (宀) - mái nhà." },
                { h: "怎么", p: "zěnme", v: "làm sao, thế nào", r: "Chẩm (怎) có bộ Tâm (心) ở dưới." },
                { h: "多少", p: "duōshǎo", v: "bao nhiêu", r: "Đa (多) - 2 bộ Tịch (đêm) + Thiểu (少)." },
                { h: "几", p: "jǐ", v: "mấy", r: "Bộ Kỷ (几) - cái bàn nhỏ." },
                { h: "怎么样", p: "zěnmeyàng", v: "như thế nào", r: "Chữ Mẫu (样) có bộ Mộc (木)." },
                { h: "医院", p: "yīyuàn", v: "bệnh viện", r: "Bộ Phương (匚) + Bộ Phụ (阝)." },
                { h: "公司", p: "gōngsī", v: "công ty", r: "Công (公) + Ti (司)." },
                { h: "学校", p: "xuéxiào", v: "trường học", r: "Bộ Tử (子) + Bộ Mộc (木)." },
                { h: "公园", p: "gōngyuán", v: "công viên", r: "Công (公) + Viên (园) - bộ Vi (囗)." },
                { h: "商店", p: "shāngdiàn", v: "cửa hàng", r: "Bộ Khẩu (口) + Bộ Quảng (广)." },
                { h: "花店", p: "huàdiàn", v: "cửa hàng hoa", r: "Bộ Thảo (艹) - cây cỏ." },
                { h: "鞋店", p: "xiédiàn", v: "cửa hàng giày dép", r: "Bộ Cách (革) - da thuộc + Bộ Quảng (广)." },
                { h: "电影院", p: "diànyǐngyuàn", v: "rạp chiếu phim", r: "Điện ảnh + Viện (院)." },
                { h: "市场", p: "shìchǎng", v: "chợ", r: "Bộ Khẩu (口) + Bộ Thổ (土)." },
                { h: "超市", p: "chāoshì", v: "siêu thị", r: "Bộ Tẩu (走) + Bộ Khẩu (口)." },
                { h: "水果店", p: "shuǐguǒdiàn", v: "cửa hàng hoa quả", r: "Thủy (水) + Quả (果) + Điếm (店)." },
                { h: "越南", p: "Yuènán", v: "VN", r: "Việt (越) + Nam (南)." },
                { h: "中国", p: "Zhōngguó", v: "TQ", r: "Trung (中) + Quốc (国)." },
                { h: "日本", p: "Rìběn", v: "Nhật Bản", r: "Nhật (日) + Bản (本)." },
                { h: "韩国", p: "Hánguó", v: "Hàn Quốc", r: "Hàn (韩) + Quốc (国)." },
                { h: "美国", p: "Měiguó", v: "Mỹ", r: "Mỹ (美) + Quốc (国)." },
                { h: "英国", p: "Yīngguó", v: "Anh", r: "Anh (英) + Quốc (国)." },
                { h: "俄国", p: "Éguó", v: "Nga", r: "" },
                { h: "德国", p: "Déguó", v: "Đức", r: "Đức (德) + Quốc (国)." },
                { h: "法国", p: "Fǎguó", v: "Pháp", r: "Pháp (法) + Quốc (国)." }
            ];

            let data = masterData.slice(0, 100);

             function changeRange() {
                const val = document.getElementById('rangeSelect').value;
                if (val === '1-100') {
                    data = masterData.slice(0, 100);
                } else if (val === '101-200') {
                    data = masterData.slice(100, 200);
                } else if (val === '201-300') {
                    data = masterData.slice(200, 300);
                } else if (val === 'all') {
                    data = [...masterData];
                } else if (val.startsWith('random-')) {
                    const count = parseInt(val.split('-')[1]);
                    const shuffledMaster = [...masterData].sort(() => Math.random() - 0.5);
                    data = shuffledMaster.slice(0, count);
                }
                
                if (typeof shuffle === 'function') {
                    shuffle();
                    updateUI();
                }
            }
            
            const originalOnLoad = window.onload;
            window.onload = () => {
                changeRange(); 
            };
        </script>
        <script src="js/flashcard.js"></script>
    </div>
</body>
</html>
