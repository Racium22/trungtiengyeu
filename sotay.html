    <div class="sotay-container">
        <!-- SELECTOR UI -->
        <div style="margin-top:20px; margin-bottom: 20px; display:flex; gap:10px; align-items:center; flex-wrap: wrap; justify-content: center;">
            <label for="rangeSelect" style="font-weight:bold; color:var(--secondary);">Chọn bài học:</label>
            <select id="rangeSelect" style="padding:8px 12px; border-radius:10px; border:1px solid #ccc; font-weight:bold; color:var(--primary); cursor:pointer;" onchange="changeRange()">
                <option value="1-100" selected>Từ 1 - 100</option>
                <option value="101-200">Từ 101 - 200</option>
                <option value="201-300">Từ 201 - 300</option>
                <option value="all">Tất cả 300 từ</option>
            </select>
        </div>

        <div class="card-view">
            <div class="info-header">
                <div style="font-size: 10px; color: #888; letter-spacing: 2px;">NGHĨA TIẾNG VIỆT</div>
                <div class="meaning" id="displayMeaning">...</div>
                <div class="pinyin-box">
                    <span class="static-hanzi" id="displayHanzi"></span>
                    <span class="pinyin" id="displayPinyin"></span>
                </div>
            </div>
            <div id="stroke-wrapper"></div>
            <button class="replay-btn" onclick="replayStroke()">VIẾT LẠI NÉT ↺</button>
            <div class="radical-box" id="displayRadical"></div>
        </div>
        <div class="controls">
            <button onclick="prevCard()">Trước</button>
            <span id="counter">1 / 100</span>
            <button onclick="nextCard()">Sau</button>
        </div>
